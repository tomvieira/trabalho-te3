model:
  base_model: "InstaDeepAI/NTv3_650M_pre"
  max_length: 4096
  use_lora: false  # set false for full backbone fine-tuning
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.1
  lora_target_modules: ["linear", "mha_output"]
  hidden_dim: 512
  head_dropout: 0.22320323256729352
  num_orders: 8
  num_superfamilies: 30
  pooling: "mean"

training:
  batch_size: 8
  max_epochs: 10
  early_stopping_patience: 8
  lambda_superfamily: 1.0
  lambda_order: 0
  lora_lr: 2.53032090218936e-05
  head_lr: 0.00028944361832243895
  weight_decay: 0.059703505248527425
  warmup_fraction: 0.05
  val_fraction: 0.1
  seed: 7
  label_smoothing: 0.04654581174590394
  class_weight_scheme: "sqrt_inv"
  gradient_accumulation_steps: 4
  use_compile: true

evaluation:
  thresholds: [0.0]
  use_hierarchical_confidence: false

data:
  label_space: "panteon30"
  fasta_path: "glare/data/PanTEon_Database_v1.6.1_benchmark_edition.fasta"
  test_fraction: 0.1
  sliding_window_overlap: 0.5
  include_default_test_set: false
  min_superfamily_count: 10
  taxonomy_train_filter:
    enabled: true
    metadata_csv: glare/data/PanTEon_Database_metadata_v1.6.1.csv
    filter_column: Kingdom
    filter_value: Animalia
    species_column: Species
    filter_match: exact
    fasta_species_mode: after_at
    species_match: normalized_contains
    fail_on_no_matches: true
  taxonomy_test_groups:
    - name: Animalia
      metadata_csv: glare/data/PanTEon_Database_metadata_v1.6.1.csv
      filter_column: Kingdom
      filter_value: Animalia
      species_column: Species
      filter_match: exact
      fasta_species_mode: after_at
      species_match: normalized_contains
      fail_on_no_matches: true
