[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glare"
version = "0.1.0"
description = "Genomic Language model for Annotation of Repetitive Elements — NTv3-650M + LoRA TE classifier"
readme = "README.md"
requires-python = ">=3.11,<=3.12.0"

dependencies = [
    "torch>=2.4,<2.6",
    "transformers>=4.40,<4.45",
    "tokenizers>=0.19,<0.20",
    "peft>=0.10,<0.14",
    "datasets>=2.18,<3",
    "accelerate>=0.29,<1",
    "huggingface_hub>=0.23,<1",
    "scikit-learn>=1.4,<2",
    "pandas>=2,<3",
    "numpy>=1.26,<3",
    "click>=8.1,<9",
    "pyyaml>=6,<7",
    "tqdm>=4.66,<5",
    "biopython>=1.83,<2",
    "matplotlib>=3.8,<4",
    "scipy>=1.11,<2",
]

[project.scripts]
glare = "glare.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["glare*"]

[tool.setuptools.data-files]
"share/glare/configs" = ["configs/*.yaml"]
